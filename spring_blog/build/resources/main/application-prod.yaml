server:
  prot: 5000

logging:
  level:
    root: INFO
    com.tenco.spring_blog: INFO    #우리 코드는 DEBUG이상까지

spring:
  #데이터 베이스 연결 (MySQL 메모리 DB 사용 )
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #localhost말고 나중에 나른 서버에 연결가능
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA 설정
  jpa:
    hibernate:
      #운영에서는 create를 쓰지않습니다 없는 테이블과 컬럼만 추가합니다
      ddl-auto: update
      #실행되는 sql을 콘솔에 촐력합니다
    show-sql: true
    defer-datasource-initialization: true

