plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tenco'
version = '0.0.1-SNAPSHOT'
description = 'spring_blog'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}


dependencies {
    // 메일 발송 (JavaMailSender)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 비밀번호 해싱 (BCryptPasswordEncoder)
    implementation 'org.springframework.security:spring-security-crypto'
    // Source: https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mustache'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mustache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    doFirst {
        jvmArgs "-javaagent:${classpath.find { it.name.contains("mockito-core") }}"
        // Windows 사용자 홈 경로에 한글(비 ASCII)이 포함되면 Mockito의 inline mock maker가
        // 네이티브 bootstrap classloader 확장(appendToBootstrapClassLoaderSearch)에서 실패한다.
        // java.io.tmpdir을 한글이 없는 경로로 바꿔서 회피한다.
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            systemProperty 'java.io.tmpdir', "${System.getenv('SystemRoot')}\\Temp"
        }
    }
}
