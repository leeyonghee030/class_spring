spring:
  config:
    import: optional:file:.env[.properties] # 스프링은 .env를 자동으로 읽지않습니다 읽을수 있도록 설정추가
  mustache:
    servlet:
      expose-session-attributes: false  #  머스태치 파일에서 세션에 담을 갑슬 바로 사용간으
  servlet:
    multipart:
      max-file-size: 10MB   #파일 하나의 최대 크기
      max-request-size: 11MB #요청전체 (파일+입력값)
  profiles:
    active: local

server:
  servlet:
    session:
      tracking-modes: cookie #세션 번호를 쿠키로만전달

#초기 파라미터 설정
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}


